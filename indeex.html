<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日学习手账</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon.png">
<meta name="theme-color" content="#D7ECF7">
<style>
:root{--bg:#e6eeea;--paper:#f8faf5;--ink:#42524f;--line:#c3d3cf;--sub:#85958f;--acc:#7fb0ac;--accd:#5f9490;--ok:#7fb59f;--bad:#c9786f;--badbg:#f6e3df;--pend:#d3dcd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2826;--paper:#263230;--ink:#dce8e5;--line:#42544f;--sub:#93a6a0;--acc:#6aa39e;--accd:#8cc3be;--ok:#6fb597;--bad:#e08d84;--badbg:#3b2a29;--pend:#3b4a47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d2826;--paper:#263230;--ink:#dce8e5;--line:#42544f;--sub:#93a6a0;--acc:#6aa39e;--accd:#8cc3be;--ok:#6fb597;--bad:#e08d84;--badbg:#3b2a29;--pend:#3b4a47;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:400px;margin:0 auto;padding:14px 12px 24px}
.dock{display:flex;justify-content:space-around;margin-bottom:12px}
.ic{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink);font-size:11px;position:relative;padding:0}
.ic .b{width:54px;height:54px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 2px 6px #0001}
.ic img{width:100%;height:100%;object-fit:contain;padding:4px}
.ic svg{width:28px;height:28px;stroke:var(--accd);fill:none;stroke-width:2.2;stroke-linecap:round}
.dot{position:absolute;top:0;right:2px;width:11px;height:11px;border-radius:50%;background:var(--bad);display:none;border:2px solid var(--bg)}
.page{background:var(--paper);padding:10px;border-radius:18px;box-shadow:0 2px 10px #0001}
.frame{border:1.5px solid var(--ink);border-radius:14px;overflow:hidden}
.g{display:grid;grid-template-columns:30% 1fr}
.hd{border-bottom:1.5px solid var(--ink);font-weight:600;letter-spacing:.08em;font-size:12px}
.hd>div{padding:8px;text-align:center}
.g>:first-child{border-right:1.5px solid var(--ink)}
.dr{border-bottom:1.5px solid var(--ink)}
.dr>div{padding:4px 6px;display:flex;align-items:center;justify-content:center;gap:2px;min-height:42px}
.dt{position:relative;font-weight:700;font-size:15px}
.dt input{position:absolute;inset:0;opacity:0;width:100%}
.nv{padding:2px 6px;border:none;background:none;font-size:18px;color:var(--ink);cursor:pointer}
.chip{flex-direction:column;gap:0;line-height:1.25;cursor:pointer}
.chip .n{font-size:10px;color:var(--sub)}
.chip b{font-size:14px;font-variant-numeric:tabular-nums;color:var(--accd)}
.r{border-bottom:1px solid var(--line);height:46px}
.r:last-of-type{border-bottom:none}
.r .l{display:flex;flex-direction:column;align-items:center;justify-content:center}
.r .rt{display:flex;align-items:center;gap:7px;padding:0 8px}
.r input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--ok)}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.r .tx{flex:1;min-width:0;border:none;padding:2px}
.r .tm{width:66px;font-size:12px;padding:0;border:none;border-bottom:1px dotted var(--line);border-radius:0;text-align:center}
.r .st{font-size:10px;color:var(--sub);min-height:12px}
.r.done .tx,.r.done .tm{text-decoration:line-through;opacity:.4}
.r.late{background:var(--badbg);box-shadow:inset 4px 0 var(--bad)}
.r.late .st{color:var(--bad);font-weight:700}
.memo{border-top:1.5px solid var(--ink)}
.memo label{display:block;padding:6px 8px 0;font-size:11px;letter-spacing:.06em;font-weight:600}
.memo textarea{width:100%;height:112px;border:none;resize:none;display:block;padding:6px 8px}
.mf{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 8px 8px;font-size:12px;color:var(--sub)}
.mf button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:2px 9px;cursor:pointer;font:inherit}
.mf button:disabled{opacity:.35;cursor:default}
.mf #mpi{min-width:70px;text-align:center}
.mask{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}
.mask.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:480px;max-height:93%;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:15px}
button.x{border:none;background:none;font-size:18px;color:var(--sub);cursor:pointer}
.pane{display:none}.pane.on{display:block}
#p-cd,#p-co{min-height:68vh}
#p-cd .it,#p-co .it{padding:14px 6px;font-size:14px}
#p-cd .it .big{font-size:16px}
#p-cd .f input,#p-co .f input{padding:9px 10px;font-size:14px}
#p-cd .btn,#p-co .btn{padding:9px 18px}
.sh{font-size:17px}
.hang{height:182px!important}
.sw.pig{width:164px}.sw.fish{width:176px}
.sw svg.shp{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 4px 5px #0002)}
.sw .txt{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#3b4b48;overflow:hidden;pointer-events:none}
.sw .txt .tt{justify-content:center;line-height:1.15}.sw .txt .nn,.sw .txt .bb{line-height:1.15}
.sw .txt .nn{color:#5d6e6a}
.sw .txt .bb{color:#3f7f7b;font-size:11.5px}
.sw.late .txt .bb{color:#b2483f}
.sw.late .face{fill:#f3bdb7}
.dr>.dcell{flex-direction:column;gap:0}
.dcell .dt{font-size:13px;font-weight:700;letter-spacing:.02em}
.dw{display:flex;align-items:center;gap:2px;font-size:11px;color:var(--sub)}
.dw .nv{font-size:16px;padding:0 7px;line-height:1}
.hang{position:relative;display:flex;justify-content:space-around;height:136px;margin:0 0 4px;padding-top:8px}
.hang:before{content:"";position:absolute;left:2%;right:2%;top:2px;height:7px;border-radius:4px;background:var(--line)}
.sw{position:relative;width:148px;transform-origin:50% 0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;margin-top:3px}
.sw:active{cursor:grabbing}
.sw .nail{position:absolute;left:50%;top:-1px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--accd);border:2px solid var(--paper);z-index:2}
.sw svg.str{display:block;width:148px;height:30px;color:var(--sub)}
.sw .card{margin-top:-1px;background:var(--paper);border:1.5px solid var(--ink);border-radius:12px;padding:6px 8px 7px;box-shadow:0 4px 8px #0002;height:84px;overflow:hidden}
.sw .card:before{content:"";display:block;position:relative;margin:-6px -8px 5px;height:5px;background:var(--acc)}
.sw.late .card{border-color:var(--bad);background:var(--badbg)}
.sw.late .card:before{background:var(--bad)}
.sw .tt{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.sw .tt img{width:20px;height:20px;object-fit:contain}
.sw .nn{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sw .bb{font-size:12.5px;font-weight:700;color:var(--accd);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw.late .bb{color:var(--bad)}
.pv{padding:4px 8px 8px;height:50px;overflow:hidden;white-space:pre-wrap;font-size:12px;cursor:pointer;color:var(--ink)}
#memo{width:100%;height:48vh;resize:none;display:block;padding:10px;font-size:14px;line-height:1.7}
#tpg{border-top:1px solid var(--line);padding-top:6px}
#p-me .mf{padding-bottom:0;margin-top:8px}
.f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.f input{flex:1;min-width:120px}
.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.it{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px dashed var(--line)}
.it .tx{flex:1;min-width:0}.it .m{font-size:11px;color:var(--sub)}
.it input[type=checkbox]{accent-color:var(--ok);width:18px;height:18px}
.it.done .tx{text-decoration:line-through;opacity:.45}
.it.late{background:var(--badbg);box-shadow:inset 3px 0 var(--bad)}
.it.late .m{color:var(--bad);font-weight:700}
.it b.big{color:var(--accd);font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:52px 1fr 36px;gap:6px;align-items:center;padding:6px 0;cursor:pointer}
.cmp .d{font-size:12px}.cmp .d small{display:block;color:var(--sub);font-size:10px}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:transparent}
.bar i{display:block;height:100%}
.lg{display:flex;gap:10px;font-size:11px;color:var(--sub);margin:4px 0 8px}
.lg s{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;text-decoration:none}
.tools textarea{width:100%;min-height:90px}
.msg{font-size:12px;margin-top:6px;color:var(--ok)}
.emp{text-align:center;color:var(--sub);padding:14px}
</style>
</head>
