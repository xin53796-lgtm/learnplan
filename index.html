<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日学习手账</title>
<style>
:root{--bg:#e6eeea;--paper:#f8faf5;--ink:#42524f;--line:#c3d3cf;--sub:#85958f;--acc:#7fb0ac;--accd:#5f9490;--ok:#7fb59f;--bad:#c9786f;--badbg:#f6e3df;--pend:#d3dcd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2826;--paper:#263230;--ink:#dce8e5;--line:#42544f;--sub:#93a6a0;--acc:#6aa39e;--accd:#8cc3be;--ok:#6fb597;--bad:#e08d84;--badbg:#3b2a29;--pend:#3b4a47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d2826;--paper:#263230;--ink:#dce8e5;--line:#42544f;--sub:#93a6a0;--acc:#6aa39e;--accd:#8cc3be;--ok:#6fb597;--bad:#e08d84;--badbg:#3b2a29;--pend:#3b4a47;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:400px;margin:0 auto;padding:14px 12px 24px}
.dock{display:flex;justify-content:space-around;margin-bottom:12px}
.ic{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink);font-size:11px;position:relative;padding:0}
.ic .b{width:54px;height:54px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 2px 6px #0001}
.ic img{width:100%;height:100%;object-fit:contain;padding:4px}
.ic svg{width:28px;height:28px;stroke:var(--accd);fill:none;stroke-width:2.2;stroke-linecap:round}
.dot{position:absolute;top:0;right:2px;width:11px;height:11px;border-radius:50%;background:var(--bad);display:none;border:2px solid var(--bg)}
.page{background:var(--paper);padding:10px;border-radius:18px;box-shadow:0 2px 10px #0001}
.frame{border:1.5px solid var(--ink);border-radius:14px;overflow:hidden}
.g{display:grid;grid-template-columns:30% 1fr}
.hd{border-bottom:1.5px solid var(--ink);font-weight:600;letter-spacing:.08em;font-size:12px}
.hd>div{padding:8px;text-align:center}
.g>:first-child{border-right:1.5px solid var(--ink)}
.dr{border-bottom:1.5px solid var(--ink)}
.dr>div{padding:4px 6px;display:flex;align-items:center;justify-content:center;gap:2px;min-height:42px}
.dt{position:relative;font-weight:700;font-size:15px}
.dt input{position:absolute;inset:0;opacity:0;width:100%}
.nv{padding:2px 6px;border:none;background:none;font-size:18px;color:var(--ink);cursor:pointer}
.chip{flex-direction:column;gap:0;line-height:1.25;cursor:pointer}
.chip .n{font-size:10px;color:var(--sub)}
.chip b{font-size:14px;font-variant-numeric:tabular-nums;color:var(--accd)}
.r{border-bottom:1px solid var(--line);height:46px}
.r:last-of-type{border-bottom:none}
.r .l{display:flex;flex-direction:column;align-items:center;justify-content:center}
.r .rt{display:flex;align-items:center;gap:7px;padding:0 8px}
.r input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--ok)}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.r .tx{flex:1;min-width:0;border:none;padding:2px}
.r .tm{width:66px;font-size:12px;padding:0;border:none;border-bottom:1px dotted var(--line);border-radius:0;text-align:center}
.r .st{font-size:10px;color:var(--sub);min-height:12px}
.r.done .tx,.r.done .tm{text-decoration:line-through;opacity:.4}
.r.late{background:var(--badbg);box-shadow:inset 4px 0 var(--bad)}
.r.late .st{color:var(--bad);font-weight:700}
.memo{border-top:1.5px solid var(--ink)}
.memo label{display:block;padding:6px 8px 0;font-size:11px;letter-spacing:.06em;font-weight:600}
.memo textarea{width:100%;height:112px;border:none;resize:none;display:block;padding:6px 8px}
.mf{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 8px 8px;font-size:12px;color:var(--sub)}
.mf button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:2px 9px;cursor:pointer;font:inherit}
.mf button:disabled{opacity:.35;cursor:default}
.mf #mpi{min-width:70px;text-align:center}
.mask{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}
.mask.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:480px;max-height:93%;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:15px}
button.x{border:none;background:none;font-size:18px;color:var(--sub);cursor:pointer}
.pane{display:none}.pane.on{display:block}
#p-cd,#p-co{min-height:68vh}
#p-cd .it,#p-co .it{padding:14px 6px;font-size:14px}
#p-cd .it .big{font-size:16px}
#p-cd .f input,#p-co .f input{padding:9px 10px;font-size:14px}
#p-cd .btn,#p-co .btn{padding:9px 18px}
.sh{font-size:17px}
.hang{height:182px!important}
.sw.pig{width:164px}.sw.fish{width:176px}
.sw svg.shp{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 4px 5px #0002)}
.sw .txt{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#3b4b48;overflow:hidden;pointer-events:none}
.sw .txt .tt{justify-content:center;line-height:1.15}.sw .txt .nn,.sw .txt .bb{line-height:1.15}
.sw .txt .nn{color:#5d6e6a}
.sw .txt .bb{color:#3f7f7b;font-size:11.5px}
.sw.late .txt .bb{color:#b2483f}
.sw.late .face{fill:#f3bdb7}
.dr>.dcell{flex-direction:column;gap:0}
.dcell .dt{font-size:13px;font-weight:700;letter-spacing:.02em}
.dw{display:flex;align-items:center;gap:2px;font-size:11px;color:var(--sub)}
.dw .nv{font-size:16px;padding:0 7px;line-height:1}
.hang{position:relative;display:flex;justify-content:space-around;height:136px;margin:0 0 4px;padding-top:8px}
.hang:before{content:"";position:absolute;left:2%;right:2%;top:2px;height:7px;border-radius:4px;background:var(--line)}
.sw{position:relative;width:148px;transform-origin:50% 0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;margin-top:3px}
.sw:active{cursor:grabbing}
.sw .nail{position:absolute;left:50%;top:-1px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--accd);border:2px solid var(--paper);z-index:2}
.sw svg.str{display:block;width:148px;height:30px;color:var(--sub)}
.sw .card{margin-top:-1px;background:var(--paper);border:1.5px solid var(--ink);border-radius:12px;padding:6px 8px 7px;box-shadow:0 4px 8px #0002;height:84px;overflow:hidden}
.sw .card:before{content:"";display:block;position:relative;margin:-6px -8px 5px;height:5px;background:var(--acc)}
.sw.late .card{border-color:var(--bad);background:var(--badbg)}
.sw.late .card:before{background:var(--bad)}
.sw .tt{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.sw .tt img{width:20px;height:20px;object-fit:contain}
.sw .nn{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sw .bb{font-size:12.5px;font-weight:700;color:var(--accd);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw.late .bb{color:var(--bad)}
.pv{padding:4px 8px 8px;height:50px;overflow:hidden;white-space:pre-wrap;font-size:12px;cursor:pointer;color:var(--ink)}
#memo{width:100%;height:48vh;resize:none;display:block;padding:10px;font-size:14px;line-height:1.7}
#tpg{border-top:1px solid var(--line);padding-top:6px}
#p-me .mf{padding-bottom:0;margin-top:8px}
.f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.f input{flex:1;min-width:120px}
.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.it{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px dashed var(--line)}
.it .tx{flex:1;min-width:0}.it .m{font-size:11px;color:var(--sub)}
.it input[type=checkbox]{accent-color:var(--ok);width:18px;height:18px}
.it.done .tx{text-decoration:line-through;opacity:.45}
.it.late{background:var(--badbg);box-shadow:inset 3px 0 var(--bad)}
.it.late .m{color:var(--bad);font-weight:700}
.it b.big{color:var(--accd);font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:52px 1fr 36px;gap:6px;align-items:center;padding:6px 0;cursor:pointer}
.cmp .d{font-size:12px}.cmp .d small{display:block;color:var(--sub);font-size:10px}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:transparent}
.bar i{display:block;height:100%}
.lg{display:flex;gap:10px;font-size:11px;color:var(--sub);margin:4px 0 8px}
.lg s{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;text-decoration:none}
.tools textarea{width:100%;min-height:90px}
.msg{font-size:12px;margin-top:6px;color:var(--ok)}
.emp{text-align:center;color:var(--sub);padding:14px}
</style>
</head>

    <div class="f"><input id="cdN" placeholder="目标名称（如：期末考试）"><input id="cdA" type="datetime-local"><button class="btn" id="cdAdd">添加</button></div>
    <div id="cdL"></div>
  </div>
  <div class="pane" id="p-co">
    <div class="f"><input id="cS" placeholder="科目" style="flex:none;width:80px"><input id="cT" placeholder="老师布置的作业"><input id="cD" type="datetime-local"><button class="btn" id="cAdd">添加</button></div>
    <div id="coL"></div>
  </div>
  <div class="pane" id="p-cmp">
    <div class="f" style="margin-bottom:4px"><button class="btn" id="n7">近 7 天</button><button class="btn" id="n14" style="background:var(--pend);color:var(--ink)">近 14 天</button></div>
    <div class="lg"><span><s style="background:var(--ok)"></s>已完成</span><span><s style="background:var(--bad)"></s>逾期未完成</span><span><s style="background:var(--pend)"></s>待办</span></div>
    <div id="cmpL"></div>
  </div>
  <div class="pane" id="p-me">
    <textarea id="memo" placeholder="今天学到了什么？写满了就翻到下一页 ↓"></textarea>
    <div class="mf"><button id="mprev">‹</button><span id="mpi"></span><button id="mnext">›</button><button id="madd">＋新页</button><button id="mdel">删本页</button></div>
  </div>
  <div class="pane tools" id="p-bk">
    <textarea id="bk" placeholder="点“生成备份”后复制保存；恢复时粘贴到这里再点恢复。"></textarea>
    <div class="f" style="margin-top:8px"><button class="btn" id="exp">生成备份</button><button class="btn" id="imp">恢复</button></div>
    <div class="msg" id="bm"></div>
  </div>
</div></div>

<script>
const KEY="studyPlanner.v1",N=12;
let D={tasks:{},memo:{},course:[],cds:[]};
try{const r=localStorage.getItem(KEY);if(r)D=Object.assign(D,JSON.parse(r))}catch(e){}
if(!D.cds)D.cds=[];
if(D.cd&&D.cd.at){D.cds.push({id:"m"+Date.now(),name:D.cd.name||"倒计时",at:D.cd.at});delete D.cd}
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
let cur=ymd(new Date()),pane=null,span=7,mp=0,tp=0;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(ms){const m=Math.floor(Math.abs(ms)/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60;return d?d+"天"+h+"时":h?h+"时"+mi+"分":mi+"分"}
function hms(ms){const s=Math.floor(ms/1e3);return Math.floor(s/86400)+"天 "+pad(Math.floor(s%86400/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)}
function slots(k){let a=(D.tasks[k]||[]).filter(Boolean);while(a.length<N||a.length%N)a.push({t:"",time:"",done:false});D.tasks[k]=a;return a}
function pages(k){let v=D.memo[k];if(!Array.isArray(v)){v=[v||""];D.memo[k]=v}return v}
function hasMemo(k){const v=D.memo[k];return Array.isArray(v)?v.some(s=>s.trim()):!!(v||"").trim()}
function renderMemo(){const a=pages(cur);mp=Math.max(0,Math.min(mp,a.length-1));$("memo").value=a[mp];$("mpi").textContent="第 "+(mp+1)+" / "+a.length+" 页";$("mprev").disabled=mp===0;$("mnext").disabled=mp>=a.length-1;const all=a.join("\n").trim();$("mpv").textContent=all||"点这里写今日收获…";$("mpv").style.opacity=all?1:.5;$("mcnt").textContent=a.length>1?"· "+a.length+" 页":""}
function renderRows(){
  const a=slots(cur);
  const dd=new Date(cur+"T00:00");$("dl").textContent=dd.getFullYear()+"."+pad(dd.getMonth()+1)+"."+pad(dd.getDate());$("dwk").textContent="周"+"日一二三四五六"[dd.getDay()];$("date").value=cur;mp=0;tp=0;renderMemo();drawRows()}
function drawRows(){const a=slots(cur);const np=a.length/N;tp=Math.max(0,Math.min(tp,np-1));$("tpi").textContent="第 "+(tp+1)+" / "+np+" 页";$("tprev").disabled=tp===0;$("tnext").disabled=tp>=np-1;
  $("rows").innerHTML=a.map((t,i)=>[t,i]).slice(tp*N,tp*N+N).map(([t,i])=>`<div class="g r" data-i="${i}"><div class="l"><input class="tm" type="time" value="${t.time||""}"><span class="st"></span></div><div class="rt"><input type="checkbox" ${t.done?"checked":""}><input class="tx" value="${esc(t.t)}"></div></div>`).join("");
  tick();
}
function cdItems(){const n=new Date();return [...D.cds].sort((x,y)=>new Date(x.at)-new Date(y.at))}
function lists(){
  const now=new Date();
  if(pane==="cd")$("cdL").innerHTML=cdItems().map(c=>{const d=new Date(c.at)-now;return `<div class="it" data-id="${c.id}"><span class="tx"><b>${esc(c.name)}</b><span class="m"><br>${c.at.replace("T"," ")}</span></span><b class="big">${d>0?hms(d):"已到时间"}</b><button class="x">✕</button></div>`}).join("")||'<div class="emp">还没有倒计时，添加一个吧 🐟</div>';
  if(pane==="co"){const a=[...D.course].sort((x,y)=>(x.done-y.done)||(x.due||"z").localeCompare(y.due||"z"));
    $("coL").innerHTML=a.map(c=>{const due=c.due?new Date(c.due):null,late=!c.done&&due&&due<now;
    return `<div class="it ${c.done?"done":""} ${late?"late":""}" data-id="${c.id}"><input type="checkbox" ${c.done?"checked":""}><span class="tx">${c.sub?"<b>"+esc(c.sub)+"</b> ":""}${esc(c.t)}<span class="m"><br>${due?"截止 "+c.due.replace("T"," ")+" · "+(c.done?"已完成":late?"已逾期"+fmt(now-due):"还剩"+fmt(due-now)):""}</span></span><button class="x">✕</button></div>`}).join("")||'<div class="emp">暂无课内任务 🐷</div>'}
}
function cmpRender(){
  const now=new Date(),today=ymd(now),days=[];
  for(let i=0;i<span;i++){const d=new Date();d.setDate(d.getDate()-i);days.push(ymd(d))}
  const st=days.map(k=>{const a=(D.tasks[k]||[]).filter(t=>t&&t.t);let dn=0,ov=0,pd=0;
    a.forEach(t=>{if(t.done)dn++;else if(k<today||(k===today&&t.time&&new Date(k+"T"+t.time)<now))ov++;else pd++});
    return{k,tot:a.length,dn,ov,pd,memo:hasMemo(k)}});
  const mx=Math.max(1,...st.map(s=>s.tot));
  $("cmpL").innerHTML=st.map(s=>{const w=v=>(v/mx*100)+"%";
    return `<div class="cmp" data-k="${s.k}"><div class="d">${s.k.slice(5).replace("-","/")}<small>${s.k===today?"今天":"周"+"日一二三四五六"[new Date(s.k+"T00:00").getDay()]}${s.memo?" 📝":""}</small></div><div class="bar"><i style="width:${w(s.dn)};background:var(--ok)"></i><i style="width:${w(s.ov)};background:var(--bad)"></i><i style="width:${w(s.pd)};background:var(--pend)"></i></div><div style="font-size:12px;text-align:right">${s.dn}/${s.tot}</div></div>`}).join("");
}
function tick(){
  const now=new Date(),a=D.tasks[cur]||[];
  document.querySelectorAll("#rows .r").forEach(el=>{
    const t=a[+el.dataset.i];if(!t)return;
    const tm=t.time?new Date(cur+"T"+t.time):null,late=!t.done&&t.t&&tm&&tm<now;
    el.classList.toggle("done",!!t.done);el.classList.toggle("late",!!late);
    el.querySelector(".st").textContent=!t.t||!tm?"":t.done?"✓":late?"逾期"+fmt(now-tm):"剩"+fmt(tm-now);
  });
  const up=cdItems().find(c=>new Date(c.at)>now);
  if(up){$("cn").textContent="距离 "+up.name;$("cb").textContent=hms(new Date(up.at)-now)}
  else{const e=new Date(now);e.setHours(24,0,0,0);$("cn").textContent="今天还剩";$("cb").textContent=hms(e-now).slice(2)}
  $("dot").style.display=D.course.some(c=>!c.done&&c.due&&new Date(c.due)<now)?"block":"none";
  lists();
}
function open(p){pane=p;
  document.querySelectorAll(".pane").forEach(e=>e.classList.toggle("on",e.id==="p-"+p));
  $("st").textContent={me:"📝 今日学习收获 · "+cur.slice(5).replace("-","/"),cd:"🐟 倒计时",co:"🐷 课内任务截止",cmp:"🐱 近期每日任务对比",bk:"☁️ 备份与恢复"}[p];
  $("mask").classList.add("on");if(p==="cmp")cmpRender();lists()}
function close(){pane=null;$("mask").classList.remove("on");renderMemo()}
document.querySelectorAll(".ic[data-p],.chip[data-p]").forEach(b=>b.onclick=()=>open(b.dataset.p));
$("sx").onclick=close;$("mask").onclick=e=>{if(e.target===$("mask"))close()};

$("rows").addEventListener("change",e=>{
  const r=e.target.closest(".r");if(!r)return;const t=D.tasks[cur][+r.dataset.i];
  if(e.target.type==="checkbox")t.done=e.target.checked;
  else if(e.target.classList.contains("tm"))t.time=e.target.value;else t.t=e.target.value;
  save();tick();
});
const shift=n=>{const d=new Date(cur+"T00:00");d.setDate(d.getDate()+n);cur=ymd(d);renderRows()};
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
$("date").onchange=e=>{if(e.target.value){cur=e.target.value;renderRows()}};
$("memo").addEventListener("input",e=>{pages(cur)[mp]=e.target.value;save()});
$("mbox").onclick=()=>open("me");
$("tprev").onclick=()=>{tp--;drawRows()};$("tnext").onclick=()=>{tp++;drawRows()};
$("tadd").onclick=()=>{const a=slots(cur);for(let i=0;i<N;i++)a.push({t:"",time:"",done:false});tp=a.length/N-1;save();drawRows()};
let tdArm=0;$("tdel").onclick=()=>{if(!tdArm){tdArm=1;$("tdel").textContent="再点确认";setTimeout(()=>{tdArm=0;$("tdel").textContent="删本页"},2500);return}tdArm=0;$("tdel").textContent="删本页";const a=slots(cur);if(a.length>N)a.splice(tp*N,N);else a.forEach(t=>{t.t="";t.time="";t.done=false});save();drawRows()};
$("mprev").onclick=()=>{mp--;renderMemo()};$("mnext").onclick=()=>{mp++;renderMemo()};
$("madd").onclick=()=>{const a=pages(cur);a.push("");mp=a.length-1;save();renderMemo();$("memo").focus()};
$("mdel").onclick=()=>{const a=pages(cur);if(a.length>1){a.splice(mp,1);mp=Math.min(mp,a.length-1)}else a[0]="";save();renderMemo()};

$("cdAdd").onclick=()=>{if(!$("cdA").value)return;D.cds.push({id:uid(),name:$("cdN").value.trim()||"倒计时",at:$("cdA").value});$("cdN").value=$("cdA").value="";save();tick()};
$("cdL").onclick=e=>{if(e.target.classList.contains("x")){const id=e.target.closest(".it").dataset.id;D.cds=D.cds.filter(c=>c.id!==id);save();tick()}};
$("cAdd").onclick=()=>{const t=$("cT").value.trim();if(!t)return;D.course.push({id:uid(),sub:$("cS").value.trim(),t,due:$("cD").value,done:false});$("cT").value=$("cS").value=$("cD").value="";save();tick()};
$("coL").addEventListener("change",e=>{const c=D.course.find(x=>x.id===e.target.closest(".it").dataset.id);if(c){c.done=e.target.checked;save();tick()}});
$("coL").addEventListener("click",e=>{if(e.target.classList.contains("x")){const id=e.target.closest(".it").dataset.id;D.course=D.course.filter(x=>x.id!==id);save();tick()}});
$("n7").onclick=()=>{span=7;cmpRender()};$("n14").onclick=()=>{span=14;cmpRender()};
$("cmpL").onclick=e=>{const r=e.target.closest(".cmp");if(r){cur=r.dataset.k;close();renderRows()}};
$("exp").onclick=()=>{const b=$("bk");b.value=JSON.stringify(D);b.focus();b.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}
  $("bm").style.color="var(--ok)";$("bm").textContent=ok?"已生成并复制，请粘贴保存好。":"已生成，请长按全选并复制保存。"};
$("imp").onclick=()=>{try{const o=JSON.parse($("bk").value);if(!o||!o.tasks)throw 0;
  D=Object.assign({tasks:{},memo:{},course:[],cds:[]},o);if(!D.cds)D.cds=[];save();renderRows();
  $("bm").style.color="var(--ok)";$("bm").textContent="恢复成功 ✓"}catch(e){$("bm").style.color="var(--bad)";$("bm").textContent="备份内容无法识别，请检查是否完整粘贴。"}};
function hang(){
  $("h1n").textContent=$("cn").textContent;$("h1b").textContent=$("cb").textContent;
  const now=new Date(),a=D.course.filter(c=>!c.done&&c.due).sort((x,y)=>x.due.localeCompare(y.due));
  const up=a.filter(c=>new Date(c.due)>=now),od=a.length-up.length,c=up[0]||a[0];
  if(!c){$("h2n").textContent=D.course.some(x=>!x.done)?"有作业未设截止时间":"暂无待交作业";$("h2b").textContent="点我查看";$("h2t").textContent="课内截止";$("sw2").classList.remove("late");return}
  const late=new Date(c.due)<now;
  $("h2n").textContent=(c.sub?c.sub+" · ":"")+c.t;
  $("h2b").textContent=(late?"已逾期":"还剩")+fmt(now-new Date(c.due));
  $("h2t").textContent="课内截止"+(a.length>1?" ×"+a.length:"")+(od&&!late?" ⚠"+od:"");
  $("sw2").classList.toggle("late",late);
}
const sws=[...document.querySelectorAll(".sw")].map((el,i)=>({el,a:(i?-1:1)*0.22,v:0,drag:false,ph:i*2.3}));
let lastT=performance.now();
function frame(t){const dt=Math.min(.033,(t-lastT)/1000);lastT=t;
  sws.forEach(s=>{if(!s.drag){const acc=-9*Math.sin(s.a)-0.4*s.v+0.55*Math.sin(t/1000*0.9+s.ph);s.v+=acc*dt;s.a+=s.v*dt}
    s.el.style.transform="rotate("+s.a+"rad)"});requestAnimationFrame(frame)}
sws.forEach(s=>{const el=s.el;let g=null;
  el.addEventListener("pointerdown",e=>{el.setPointerCapture(e.pointerId);const pr=el.offsetParent.getBoundingClientRect();
    g={px:pr.left+el.offsetLeft+el.offsetWidth/2,py:pr.top+el.offsetTop,x0:e.clientX,y0:e.clientY,t0:performance.now(),mv:0,lt:performance.now()};s.drag=true;s.v=0});
  el.addEventListener("pointermove",e=>{if(!g)return;g.mv=Math.max(g.mv,Math.hypot(e.clientX-g.x0,e.clientY-g.y0));
    const ang=Math.max(-1.15,Math.min(1.15,Math.atan2(e.clientX-g.px,Math.max(30,e.clientY-g.py))));
    const n=performance.now(),dt=Math.max(.008,(n-g.lt)/1000);s.v=s.v*.6+((ang-s.a)/dt)*.4;g.lt=n;s.a=ang});
  const end=e=>{if(!g)return;s.drag=false;s.v=Math.max(-8,Math.min(8,s.v));
    if(g.mv<6&&performance.now()-g.t0<400){s.v+=(Math.random()<.5?-1:1)*2.5;open(el.dataset.p)}g=null};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end)});
requestAnimationFrame(frame);
save();renderRows();hang();setInterval(()=>{tick();hang()},1000);
</script>
</body>
</html>
